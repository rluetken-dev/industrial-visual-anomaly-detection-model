[build-system]
requires = ["setuptools>=84.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-visual-anomaly-detection"
version = "0.1.0"
description = "Model-development package for industrial visual anomaly detection."
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]